name: my first workflow it will change the version in the pom.xml to the build number

on:
  workflow_dispatch: # allows manual triggering for checking it without merging
  push: #not yet i want to check if it will work before i merge it
    branches: [ "master" ]

jobs:
  build:
    name: version control part
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # its eclips distribution
          java-version: '21'

      - name: Output Run Information
        run: |
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Run Attempt: ${{ github.run_attempt }}"

      - name: Update pom.xml version
        run: mvn versions:set -DnewVersion=1.0.${{ github.run_number }} #defines replacement value

      - name: log to dockerhub
        uses: docker/login-action@v3 # log into dockerhub
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6 # build the image and push it to dockerhub
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/java-exe:1.0.${{ github.run_number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/java-exe:latest
